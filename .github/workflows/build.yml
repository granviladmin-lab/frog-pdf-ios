name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -version
          xcodegen generate

      - name: Pick an iPad simulator
        id: sim
        run: |
          ID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(rt,x) for rt,xs in d.items() if "iOS" in rt for x in xs if x["name"].startswith("iPad")]
          c.sort(key=lambda t:(t[0], "Pro" in t[1]["name"]), reverse=True)
          print(c[0][1]["udid"]); print(c[0][1]["name"], c[0][0], file=sys.stderr)')
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          mkdir -p shots
          set -o pipefail
          TEST_RUNNER_SHOTS_DIR="$PWD/shots" xcodebuild test \
            -project FrogPDF.xcodeproj -scheme FrogPDF \
            -destination "id=${{ steps.sim.outputs.id }}" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "error:|warning: .*deprecated|Test Case|Executed|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" test.log

      - name: Upload screenshots and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            shots/
            test.log

      - name: Build IPA (unsigned, sign when sideloading)
        run: |
          set -o pipefail
          xcodebuild build -project FrogPDF.xcodeproj -scheme FrogPDF -configuration Release \
            -sdk iphoneos -destination generic/platform=iOS -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FrogPDF.app Payload/
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" Payload/FrogPDF.app/Info.plist
          lipo -info Payload/FrogPDF.app/FrogPDF
          zip -qry FrogPDF.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FrogPDF-ipa
          path: FrogPDF.ipa

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" FrogPDF.ipa --title "Frog PDF ${GITHUB_REF_NAME}" --notes "Unsigned build. Sign and install with a free Apple ID using a sideloading tool (see README)."
